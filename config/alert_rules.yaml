alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'p95(response_sent.latency_ms) > 3000'
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202602684
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: 'count(request_failed) / count(request_received) * 100 > 2'
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202602684
    runbook: docs/alerts.md#alert-2
  - name: CostBudgetBurn
    severity: warning
    condition: 'sum(response_sent.cost_usd) over 1h > 2.5 or avg(response_sent.tokens_out) > 2x baseline'
    duration: 10m
    type: symptom-based
    channel: slack
    owner: student-2A202602684
    runbook: docs/alerts.md#alert-3
